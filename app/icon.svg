<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: Deep Onyx Black rounded luxury container -->
  <rect width="64" height="64" rx="14" fill="#111111" />
  
  <!-- Luxury gold border accent -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Brand Monogram 'M' for MARWARE in Editorial High-Fashion Serif Style -->
  <text x="32" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#FAF9F6" text-anchor="middle" letter-spacing="-1">M</text>
  
  <!-- Central luxury accent diamond/star over the M apex -->
  <circle cx="32" cy="14" r="2.5" fill="#D4AF37" />
</svg>
